services:
  - type: web
    name: ansou
    runtime: node
    plan: free
    buildCommand: "npm install"
    startCommand: "node server.js"
    envVars:
      - key: API_KEY
        sync: false
      - key: DATABASE_URL
        sync: false
      - key: SUPABASE_URL
        sync: false
      - key: SUPABASE_ANON_KEY
        sync: false
      - key: APP_PASSWORD
        sync: false
      - key: AI_MODEL
        value: claude-sonnet-4-6
      - key: NODE_VERSION
        value: 22.12.0
